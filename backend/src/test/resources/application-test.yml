spring:
  datasource:
    url: jdbc:h2:mem:uems_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  upload:
    avatar-dir: ./target/test-uploads/avatars
    receipt-dir: ./target/test-uploads/receipts
    branding-dir: ./target/test-uploads/branding
  seed:
    enabled: false
