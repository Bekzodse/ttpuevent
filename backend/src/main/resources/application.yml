server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: uems-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/uems_db}
    username: ${SPRING_DATASOURCE_USERNAME:macbookprom2pro}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    # Base64-encoded 256+ bit secret (override via JWT_SECRET env var in production)
    secret: ${JWT_SECRET:V3JhblVuaXZlcnNpdHlNYW5hZ2VtZW50U3lzdGVtU2VjcmV0S2V5MjAyNlNlY3VyZUpXVA==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  upload:
    avatar-dir: ${AVATAR_UPLOAD_DIR:./uploads/avatars}
    receipt-dir: ${RECEIPT_UPLOAD_DIR:./uploads/receipts}
    branding-dir: ${BRANDING_UPLOAD_DIR:./uploads/branding}
    event-dir: ${EVENT_UPLOAD_DIR:./uploads/events}
  payment:
    bank-card-number: ${BANK_CARD_NUMBER:8600 1204 8899 4421}
    bank-card-holder: ${BANK_CARD_HOLDER:NATIONAL UNIVERSITY TREASURY}
    bank-name: ${BANK_NAME:Kapitalbank (University Treasury Account)}
  booking:
    reservation-hours: ${BOOKING_RESERVATION_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  seed:
    enabled: ${SEED_DATA:true}
  openapi:
    local-url: ${OPENAPI_LOCAL_URL:http://localhost:8080}
    prod-url: ${OPENAPI_PROD_URL:https://api.turin-uems.uz}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
    display-request-duration: true
    doc-expansion: none
    filter: true
